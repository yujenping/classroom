<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位木馬屠城記 - 互動實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #0a192f; color: #ccd6f6; font-family: sans-serif; }
        .neon-border { border: 1px solid #64ffda; box-shadow: 0 0 10px rgba(100, 255, 218, 0.3); }
        .btn-choice { background-color: #112240; transition: all 0.2s; }
        .btn-choice:hover { background-color: #233554; border-color: #64ffda; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-[#64ffda] tracking-wider">DIGITAL TROJAN HORSE</h1>
        <p class="text-sm text-[#8892b0] mt-1">行為經濟學即時心理實驗</p>
    </div>

    <div id="experiment-card" class="w-full max-w-md p-6 rounded-xl bg-[#112240] neon-border text-center">
        <div id="state-waiting" class="py-12">
            <div class="animate-spin inline-block w-8 height-8 border-4 border-[#64ffda] border-t-transparent rounded-full mb-4"></div>
            <p class="text-lg text-[#ccd6f6]">實驗尚未開始...</p>
            <p class="text-sm text-[#8892b0] mt-2">請看前方大螢幕，等待講師啟動。</p>
        </div>

        <div id="state-active" class="hidden text-left">
            <span id="exp-tag" class="text-xs font-bold text-[#64ffda] bg-[#172a45] px-3 py-1 rounded-full uppercase">實驗項目</span>
            <h2 id="exp-question" class="text-xl font-bold my-4 leading-relaxed text-white">問題載入中...</h2>
            
            <div id="options-container" class="space-y-4 mt-6">
                </div>
        </div>

        <div id="state-voted" class="hidden py-12 text-center">
            <svg class="w-16 h-16 text-[#64ffda] mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-lg font-bold text-white">投票成功！</p>
            <p class="text-sm text-[#8892b0] mt-2">您的決定已匿名送出，請看大螢幕看開票結果。</p>
        </div>
    </div>

    <script>
        // 1. 初始化 Firebase (請替換為您自己的 Firebase 專案配置)
        const firebaseConfig = {
          apiKey: "AIzaSyAW8ECm1TXHG_vOT3Q_9WkNMJAfgfYtaxk",
          authDomain: "classroom2-18a0b.firebaseapp.com",
          databaseURL: "https://classroom2-18a0b-default-rtdb.firebaseio.com",
          projectId: "classroom2-18a0b",
          storageBucket: "classroom2-18a0b.firebasestorage.app",
          messagingSenderId: "1057562658414",
          appId: "1:1057562658414:web:dff59c17be75d3e1d2487f",
          measurementId: "G-HXW5G00TCN"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. 當地分組邏輯（A組或B組，隨機分配且儲存在手機，確保不會亂跳）
        if (!localStorage.getItem('userGroup')) {
            const group = Math.random() < 0.5 ? 'A' : 'B';
            localStorage.setItem('userGroup', group);
        }
        const myGroup = localStorage.getItem('userGroup');

        // 3. 題目資料庫 (對應演講逐字稿)
        const dbQuestions = {
            exp1: {
                title: "實驗 1：數位產品體驗調查",
                A: { q: "你下載了一款熱門手遊。你會選擇哪個方案？", options: ["方案甲：直接付費 300 元購買永久遊玩權", "方案乙：免費試玩 7 天，試玩期滿後需付費 330 元"] },
                B: { q: "你下載了一款熱門手遊。你會選擇哪個方案？", options: ["方案甲：直接付費 300 元購買永久遊玩權", "方案乙：免費試玩 7 天，試玩期滿後需付費 300 元"] }
            },
            exp2: {
                title: "實驗 2：訂閱制偏好調查",
                A: { q: "你想訂閱某科技網站電子報，你會選哪一個？", options: ["方案 A（純數位版）：每年 500 元", "方案 B（純紙本雜誌版）：每年 1,200 元", "方案 C（數位+紙本合訂版）：每年 1,200 元"] },
                B: { q: "你想訂閱某科技網站電子報，你會選哪一個？", options: ["方案 A（純數位版）：每年 500 元", "方案 B（純紙本雜誌版）：每年 1,200 元", "方案 C（數位+紙本合訂版）：每年 1,200 元"] }
            },
            exp3: {
                title: "實驗 3：日常決策心理測試",
                A: { q: "你花 300 元買了電影票，到門口發現票丟了。你願意現場再花 300 元買票看電影嗎？", options: ["會，再買一張進去看", "不會，心情不好不看了"] },
                B: { q: "你花 300 元買了電影票，到門口發現票丟了。你願意現場再花 300 元買票看電影嗎？", options: ["會，再買一張進去看", "不會，心情不好不看了"] }
            }
        };

        let currentExp = "";
        let hasVotedThisExp = "";

        // 4. 監聽講師當前啟動的題目
        db.ref('currentStatus').on('value', (snapshot) => {
            const status = snapshot.val();
            if (!status || status.activeExp === "waiting") {
                showState("waiting");
            } else {
                currentExp = status.activeExp;
                // 如果這一題已經投過票，就直接顯示已投票
                if (hasVotedThisExp === currentExp) {
                    showState("voted");
                } else {
                    renderQuestion(currentExp);
                }
            }
        });

        // 5. 畫面切換控制
        function showState(state) {
            document.getElementById('state-waiting').classList.add('hidden');
            document.getElementById('state-active').classList.add('hidden');
            document.getElementById('state-voted').classList.add('hidden');
            document.getElementById('state-' + state).classList.remove('hidden');
        }

        // 6. 渲染題目
        function renderQuestion(expId) {
            const expData = dbQuestions[expId];
            const groupData = expData[myGroup]; // A或B組看自己的題目
            
            document.getElementById('exp-tag').innerText = expData.title + ` (測試碼: ${myGroup})`;
            document.getElementById('exp-question').innerText = groupData.q;
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            
            groupData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-lg border border-[#233554] btn-choice text-sm font-medium text-[#ccd6f6] focus:outline-none";
                btn.innerText = optText;
                btn.onclick = () => submitVote(expId, myGroup, index);
                container.appendChild(btn);
            });
            showState("active");
        }

        // 7. 送出投票
        function submitVote(expId, group, optionIndex) {
            // 在資料庫中對應路徑的值 +1
            db.ref(`results/${expId}/${group}/opt${optionIndex}`).transaction((currentValue) => {
                return (currentValue || 0) + 1;
            });
            hasVotedThisExp = expId;
            showState("voted");
        }
    </script>
</body>
</html>
